name: Work item
description: Claim a roadmap task, request a shared change, or record a blocker.
title: '[P?-??] '
body:
  - type: input
    id: task
    attributes:
      label: Roadmap task ID
      placeholder: P2-01 or S-01
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Accountable lane
      options:
        - P1 — Platform and identity
        - P2 — Projects
        - P3 — Progress
        - P4 — Opportunities
        - P5 — Discovery and integration
    validations:
      required: true
  - type: input
    id: human
    attributes:
      label: Accountable human and branch
      description: Also use the GitHub assignee field. Each person uses a separate checkout and one active implementation PR.
      placeholder: '@handle; p2/publish-project'
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed paths and agent subareas
      description: Copy from ownership.json; assign disjoint files if several agents are helping.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and shared change requests
      description: Link prerequisite PRs. Shared contracts, dependencies and migrations belong to P1. Say “none” if independent.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and validation
      description: Describe the smallest complete slice, commands/checks and intended handoff recipient.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Current blockers and next update
      description: Use issue comments for live status; no shared lock/status file. Never include secrets or tokens.
